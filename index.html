<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dance Ministry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header class="top">
  <div>
    <p class="hello" id="who">Guest (view only)</p>
    <h1>Steps Catalogue</h1>
  </div>
  <button id="login" type="button">Log-in</button>
</header>
<div class="hero">
  <span class="hl">LIBRARY</span>
  <div class="big"><span id="ncount">0</span><small> songs</small></div>
  <p id="nsteps">0 steps ready to use</p>
</div>

<dialog id="loginbox" aria-labelledby="ltitle">
  <form id="loginform">
    <b id="ltitle">Log-in</b>
    <input class="search" id="em" type="text" placeholder="Name" aria-label="Name" autocomplete="username" autocapitalize="none" required>
    <input class="search" id="pw" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
    <p class="err" id="lerr" role="alert"></p>
    <div class="actions">
      <button class="primary" id="go" type="submit">Submit</button>
      <button id="closelogin" type="button">Cancel</button>
    </div>
  </form>
</dialog>

<p class="err" id="msg" role="alert"></p>
<nav class="bottomnav" aria-label="Main" id="tabs"></nav>

<section id="view-songs">
  <p class="hide" id="addsong"><button class="primary" id="addsongbtn" type="button">+ Add New Song</button></p>
  <div class="card hide" id="songform"></div>
  <div class="filter"><label for="cat">Category</label><select id="cat"></select></div>
  <div id="songs"></div>
</section>

<section id="view-steps" class="hide">
  <div class="card hide" id="stepform"><b>New Step</b><div class="filter" style="margin:8px 0 0">
    <input class="search" id="sn" placeholder="Name (ex. Hallelujah A)" aria-label="Name of the step">
    <input class="search" id="sc" placeholder="Short (ex. Hal A)" maxlength="8" aria-label="Abbreviation" style="max-width:120px">
    <button class="primary" id="sadd" type="button">Add</button>
  </div>
  </div>
  <div class="card"><table><thead><tr>
    <th>Name of the Step</th>
    <th>Abbreviation</th>
    <th></th></tr></thead><tbody id="lib"></tbody></table>
  </div>
</section>

<section id="view-sched" class="hide">
  <div class="card" id="form"><b>Create a schedule</b>
    <label class="m" for="sq" style="display:block;margin:8px 0 4px">Search songs</label>
    <input class="search" id="sq" type="search" placeholder="Title or Singer" autocomplete="off">
    <div id="results"></div><div id="added"></div></div>
  <p class="m">Preview:</p>
  <div class="paper" id="paper"></div>
  <p><button class="primary" id="print" type="button">Download PDF / Print</button></p>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* Put your Supabase values here: Project Settings > API Keys */
var SUPABASE_URL="https://gdbwuoyluexmuwrmrmxz.supabase.co";
var SUPABASE_KEY="sb_publishable_naZ7MVa6whcAQ6jPFbFrHg_ncTl71UI";

var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
/* People log in with a name. It becomes name@DOMAIN behind the scenes (create users in Supabase with that email). */
var DOMAIN="dance-ministry.com";
function toEmail(n){n=n.trim().toLowerCase();return n.indexOf("@")>-1?n:n.replace(/\s+/g,".")+"@"+DOMAIN}
var ORDER=["I","V","PC","C","PoC","B"],FULL={I:"Instrumental",V:"Verse",PC:"Pre-chorus",C:"Chorus",PoC:"Post-chorus",B:"Bridge"},OPT={I:1,PC:1,PoC:1};
var STEPS=[],S={},SONGS=[],user=null,view="songs",cat="All",openId=null,editId=null,draft=null,sched=[];
try{sched=JSON.parse(localStorage.getItem("sched")||"[]")}catch(e){}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function msg(t){$("msg").textContent=t||""}
function song(id){return SONGS.find(function(x){return x.id===id})}
function saveSched(){try{localStorage.setItem("sched",JSON.stringify(sched))}catch(e){}}
function okUrl(u){return /^https?:\/\//i.test(u)}

async function load(){
  var a=await sb.from("steps").select("*").order("name"),b=await sb.from("songs").select("*").order("title");
  if(a.error||b.error){msg("Could not load data: "+(a.error||b.error).message);return}
  STEPS=a.data;S={};STEPS.forEach(function(x){S[x.id]=x});SONGS=b.data;
  sched=sched.filter(function(id){return song(id)});
  msg("");renderAll();
}
function renderAll(){renderSongs();renderLib();renderSched();$("ncount").textContent=SONGS.length;$("nsteps").textContent=STEPS.length+" steps ready to use"}

/* tabs */
var ICON={
 songs:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>',
 steps:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
 sched:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>'
};
function renderTabs(){
  var item=function(v,label){return'<button type="button" class="nav" data-v="'+v+'"'+(v!=="account"?' aria-pressed="'+(view===v)+'"':"")+'>'+ICON[v]+"<span>"+label+"</span></button>"};
  $("tabs").innerHTML=item("songs","Songs")+item("steps","Steps")+
    (user?'<button type="button" class="fab" data-v="add" aria-label="Add new song">+</button>':"")+
    item("sched","Schedule");
  ["songs","steps","sched"].forEach(function(v){$("view-"+v).classList.toggle("hide",v!==view)});
}
$("tabs").addEventListener("click",async function(e){
  var b=e.target.closest("button");if(!b)return;var v=b.dataset.v;
  if(v==="add"){view="songs";renderTabs();openForm(null);return}
  view=v;renderTabs();window.scrollTo({top:0});
});

/* login */
function applyUser(){
  $("who").textContent=user?"Logged in: "+(user.email?user.email.split("@")[0]:"editor"):"Guest (view only)";
  renderTabs();
  $("login").textContent=user?"Log-out":"Log-in";
  if($("loginbox").open)$("loginbox").close();
  ["addsong","stepform"].forEach(function(i){$(i).classList.toggle("hide",!user)});
  if(!user)$("songform").classList.add("hide");
  renderAll();
}
$("loginform").addEventListener("submit",async function(e){
  e.preventDefault();
  var r=await sb.auth.signInWithPassword({email:toEmail($("em").value),password:$("pw").value});
  if(r.error){$("lerr").textContent="Could not log in. Check your name and password.";return}
  $("lerr").textContent="";$("pw").value="";$("loginbox").close();
});
$("login").onclick=async function(){
  if(user){await sb.auth.signOut()}
  else{$("lerr").textContent="";$("loginbox").showModal()}
};
$("closelogin").onclick=function(){$("loginbox").close()};
sb.auth.onAuthStateChange(function(ev,s){user=s?s.user:null;applyUser()});

/* songs */
var CATS=["All","Praise ENG","Praise TAG","Worship ENG","Worship TAG"];
CATS.forEach(function(c){$("cat").add(new Option(c,c))});
$("cat").onchange=function(){cat=this.value;openId=null;renderSongs()};
function stepPills(ids){return ids.map(function(id){var s=S[id];return s?'<span class="pill"><i>'+esc(s.short)+"</i>"+esc(s.name)+"</span>":""}).join("")}
function renderSongs(){
  var h="",n=0;
  SONGS.forEach(function(x){
    if(cat!=="All"&&cat!==x.cat+" "+x.lang)return;
    var o=openId===x.id,body="";
    if(o){
      body+='<p style="margin:10px 0 0">'+(okUrl(x.link)?'<a class="link" href="'+esc(x.link)+'" target="_blank" rel="noopener">Listen (YouTube/Spotify)</a>':'<span class="m">No link</span>')+(user?' <button class="small" type="button" data-edit="'+x.id+'">Edit</button>':"")+"</p>";
      ORDER.forEach(function(k){var a=x.sec&&x.sec[k];if(a&&a.length)body+='<div class="sec"><b>'+k+"</b><div>"+stepPills(a)+"</div></div>"});
      if(x.lyrics)body+='<details class="lyr"><summary>Lyrics</summary><pre>'+esc(x.lyrics)+"</pre></details>";
    }
    h+='<div class="card"><button class="song-head" type="button" aria-expanded="'+o+'" data-id="'+x.id+'"><span class="num">'+(++n)+'</span><span class="mid"><span class="t">'+esc(x.title)+'</span><span class="m">'+esc(x.singer)+" \u00b7 "+x.cat+" "+x.lang+"</span></span><span class=\"chev\" aria-hidden=\"true\">\u203a</span></button>"+body+"</div>";
  });
  $("songs").innerHTML=h||'<p class="m">No songs yet.</p>';
}
$("songs").addEventListener("click",function(e){
  var ed=e.target.closest("[data-edit]");if(ed){openForm(Number(ed.dataset.edit));return}
  var b=e.target.closest(".song-head");if(!b)return;
  var id=Number(b.dataset.id);openId=openId===id?null:id;renderSongs();
  var n=$("songs").querySelector('[data-id="'+id+'"]');if(n)n.focus();
});

/* add / edit song */
function openForm(id){
  editId=id;
  draft=id===null?{title:"",singer:"",cat:"Praise",lang:"ENG",link:"",lyrics:"",sec:{}}:JSON.parse(JSON.stringify(song(id)));
  draft.sec=draft.sec||{};
  drawForm("");$("songform").classList.remove("hide");$("songform").scrollIntoView();
}
$("addsongbtn").onclick=function(){openForm(null)};
function drawForm(err){
  var opts=STEPS.map(function(s){return'<option value="'+s.id+'">'+esc(s.name)+" ("+esc(s.short)+")</option>"}).join("");
  var sel=function(f,a){return'<select data-f="'+f+'" aria-label="'+f+'">'+a.map(function(v){return"<option"+(draft[f]===v?" selected":"")+">"+v+"</option>"}).join("")+"</select>"};
  var h="<b>"+(editId===null?"New song":"Edit song")+"</b>"+
   '<input class="search" data-f="title" placeholder="Title" aria-label="Title" value="'+esc(draft.title)+'" style="margin-top:8px">'+
   '<input class="search" data-f="singer" placeholder="Singer" aria-label="Singer" value="'+esc(draft.singer)+'" style="margin-top:8px">'+
   '<div class="filter" style="margin:8px 0">'+sel("cat",["Praise","Worship"])+sel("lang",["ENG","TAG"])+"</div>"+
   '<input class="search" data-f="link" placeholder="YouTube or Spotify link" aria-label="Link" value="'+esc(draft.link)+'">'+
   '<textarea class="search" data-f="lyrics" placeholder="Lyrics" aria-label="Lyrics" style="margin-top:8px">'+esc(draft.lyrics)+"</textarea>";
  ORDER.forEach(function(k){var a=draft.sec[k]||[];
    h+='<div class="fs"><b>'+FULL[k]+(OPT[k]?' <span class="m">(optional)</span>':"")+"</b><div>"+a.map(function(id,n){var s=S[id];return s?'<span class="pill"><i>'+esc(s.short)+"</i>"+esc(s.name)+' <button class="x" type="button" data-rm="'+k+":"+n+'" aria-label="Remove step">\u2715</button></span>':""}).join("")+'</div><select data-add="'+k+'" aria-label="Add a step to '+FULL[k]+'"><option value="">+ Add a step</option>'+opts+"</select></div>";
  });
  h+=(err?'<p class="err" role="alert">'+esc(err)+"</p>":"")+'<p><button class="primary" id="save" type="button">Save</button> <button id="cancel" type="button">Cancel</button>'+(editId!==null?' <button id="del" type="button">Delete</button>':"")+"</p>";
  $("songform").innerHTML=h;
}
$("songform").addEventListener("input",function(e){var f=e.target.dataset.f;if(f)draft[f]=e.target.value});
$("songform").addEventListener("change",function(e){var a=e.target.dataset.add;if(a&&e.target.value){(draft.sec[a]=draft.sec[a]||[]).push(Number(e.target.value));drawForm("")}});
$("songform").addEventListener("click",async function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.rm){var p=b.dataset.rm.split(":");draft.sec[p[0]].splice(Number(p[1]),1);drawForm("");return}
  if(b.id==="cancel"){$("songform").classList.add("hide");return}
  if(b.id==="del"){
    if(!confirm("Delete this song?"))return;
    var r=await sb.from("songs").delete().eq("id",editId);
    if(r.error){drawForm("Could not delete: "+r.error.message);return}
    $("songform").classList.add("hide");openId=null;await load();return;
  }
  if(b.id==="save"){
    var d=draft;
    if(!d.title.trim()){drawForm("Enter a title.");return}
    var miss=["V","C","B"].filter(function(k){return !(d.sec[k]&&d.sec[k].length)});
    if(miss.length){drawForm("Add steps to: "+miss.map(function(k){return FULL[k]}).join(", ")+".");return}
    Object.keys(d.sec).forEach(function(k){if(!d.sec[k].length)delete d.sec[k]});
    var row={title:d.title.trim(),singer:d.singer.trim(),cat:d.cat,lang:d.lang,link:d.link.trim(),lyrics:d.lyrics,sec:d.sec};
    var q=editId===null?await sb.from("songs").insert(row):await sb.from("songs").update(row).eq("id",editId);
    if(q.error){drawForm("Could not save: "+q.error.message);return}
    $("songform").classList.add("hide");await load();
  }
});

/* steps library */
function renderLib(){
  $("lib").innerHTML=STEPS.map(function(s){
    if(!user)return"<tr><td>"+esc(s.name)+"</td><td><b>"+esc(s.short)+"</b></td><td></td></tr>";
    return'<tr data-sid="'+s.id+'"><td><input class="search" data-n value="'+esc(s.name)+'" aria-label="Name"></td><td><input class="search" data-sh maxlength="8" value="'+esc(s.short)+'" aria-label="Abbreviation" style="max-width:100px"></td><td><button class="small" type="button" data-ssave="'+s.id+'">Save</button></td></tr>';
  }).join("");
}
$("lib").addEventListener("click",async function(e){
  var b=e.target.closest("[data-ssave]");if(!b)return;
  var tr=b.closest("tr"),n=tr.querySelector("[data-n]").value.trim(),sh=tr.querySelector("[data-sh]").value.trim();
  if(!n||!sh){msg("Name and abbreviation are required.");return}
  var r=await sb.from("steps").update({name:n,short:sh}).eq("id",Number(b.dataset.ssave));
  if(r.error){msg("Could not save: "+r.error.message);return}
  msg("");await load();
});
$("sadd").onclick=async function(){
  var n=$("sn").value.trim(),c=$("sc").value.trim();if(!n||!c)return;
  var r=await sb.from("steps").insert({name:n,short:c});
  if(r.error){msg("Could not add: "+r.error.message);return}
  $("sn").value="";$("sc").value="";msg("");await load();
};

/* schedule */
function songHTML(x){
  var l="";
  ORDER.forEach(function(k){var a=x.sec&&x.sec[k];if(!a||!a.length)return;
    var line=esc(k+": "+a.map(function(id){return S[id]?S[id].short:"?"}).join(", "));
    l+="<div>"+(k==="C"?"<u>"+line+"</u>":line)+"</div>";
  });
  return'<div class="ps"><b>'+esc(x.title.toUpperCase())+"</b>"+l+"</div>";
}
function renderSched(){
  var t=$("sq").value.trim().toLowerCase(),h="";
  if(t){
    SONGS.forEach(function(x){
      if(sched.indexOf(x.id)>-1)return;
      if((x.title+" "+x.singer).toLowerCase().indexOf(t)<0)return;
      h+='<div class="row"><span class="grow"><b>'+esc(x.title)+'</b><br><span class="m">'+esc(x.singer)+" \u00b7 "+x.cat+" "+x.lang+'</span></span><button class="small primary" type="button" data-add="'+x.id+'">Add</button></div>';
    });
    if(!h)h='<p class="m">No results, or already in the schedule.</p>';
  }
  $("results").innerHTML=h;
  $("added").innerHTML=(sched.length?'<p class="m" style="margin:12px 0 0">In schedule ('+sched.length+")</p>":'<p class="m">No songs yet. Search above to add one.</p>')+
    sched.map(function(id,k){var x=song(id);
      return'<div class="row"><span class="grow"><b>'+esc(x.title)+'</b> <span class="m">'+x.cat+" "+x.lang+'</span></span><button class="small" type="button" data-up="'+k+'" aria-label="Move up">\u2191</button><button class="small" type="button" data-down="'+k+'" aria-label="Move down">\u2193</button><button class="small" type="button" data-rm="'+k+'" aria-label="Remove">\u2715</button></div>';
    }).join("");
  var P="",W="";
  sched.forEach(function(id){var x=song(id);if(x.cat==="Praise")P+=songHTML(x);else W+=songHTML(x)});
  $("paper").innerHTML='<div class="cols"><div>'+P+"</div><div>"+W+"</div></div>";
  saveSched();
}
$("sq").addEventListener("input",renderSched);
$("form").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.add!==undefined){sched.push(Number(d.add));$("sq").value="";renderSched();$("sq").focus();return}
  var k=Number(d.up!==undefined?d.up:d.down!==undefined?d.down:d.rm);
  if(d.rm!==undefined)sched.splice(k,1);
  else{var j=d.up!==undefined?k-1:k+1;if(j>=0&&j<sched.length){var tmp=sched[k];sched[k]=sched[j];sched[j]=tmp}}
  renderSched();
});
$("print").onclick=function(){window.print()};

renderTabs();
load();
</script>
</body>
</html>
